# nginx: include inside the HTTPS server { } block.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; frame-src https://player.vimeo.com; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# BETA: keep out of search engines. Remove this line at launch.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
server_tokens off;

# If the lead form posts to another origin, add that origin to connect-src.
